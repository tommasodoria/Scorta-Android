name: Compila Scorta APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Importa sorgenti iniziali
        run: |
          if [ ! -f app/build.gradle ]; then
            unzip -o Scorta_Android_Progetto.zip -d .
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app build.gradle settings.gradle gradle.properties .gitignore GRADLE_SETUP.txt LEGGIMI_PRIMA.txt
            git commit -m "Import Android sources from project archive"
            git push
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compila e controlla
        run: gradle assembleDebug lintDebug --no-daemon
      - name: Verifica APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Scorta-Android.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose Scorta-Android.apk
          sha256sum Scorta-Android.apk > Scorta-Android.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Scorta-Android-APK
          path: |
            Scorta-Android.apk
            Scorta-Android.apk.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-lint-report
          path: app/build/reports/lint-results-debug.html
      - name: Pubblica APK installabile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "build-${{ github.run_number }}" Scorta-Android.apk Scorta-Android.apk.sha256 --title "Scorta Android - build ${{ github.run_number }}" --notes "APK debug firmato per installazione diretta. Dati locali, nessun permesso Internet. Android 8 o successivo."
