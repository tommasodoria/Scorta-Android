name: Compila Scorta APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compila e controlla
        run: gradle assembleDebug lintDebug --no-daemon
      - name: Verifica APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Scorta-Android.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose Scorta-Android.apk
          sha256sum Scorta-Android.apk > Scorta-Android.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Scorta-Android-APK
          path: |
            Scorta-Android.apk
            Scorta-Android.apk.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-lint-report
          path: app/build/reports/lint-results-debug.html
