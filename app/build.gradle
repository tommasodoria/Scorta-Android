plugins {
    id 'com.android.application'
}

android {
    namespace 'it.scorta.inventario'
    compileSdk 35

    defaultConfig {
        applicationId 'it.scorta.inventario'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '2.2-android'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
